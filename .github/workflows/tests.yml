name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Python and notebooks
        run: >-
          python -m compileall -q src run_analysis.py &&
          python -m json.tool notebooks/01_exploracion_original.ipynb > /dev/null &&
          python -m json.tool notebooks/02_pipeline_reproducible.ipynb > /dev/null

